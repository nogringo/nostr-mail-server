services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nostrmail
      POSTGRES_USER: nostrmail
      POSTGRES_PASSWORD: nostrmail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostrmail -d nostrmail"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - nostr-mail-server-postgres-dev:/var/lib/postgresql

volumes:
  nostr-mail-server-postgres-dev:
